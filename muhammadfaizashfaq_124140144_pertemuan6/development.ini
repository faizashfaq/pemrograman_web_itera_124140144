###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_debugtoolbar
    pyramid_tm

# --- Database ---------------------------------------------------------------
# Bawaan template memakai SQLite. Untuk praktikum ini kita beralih ke PostgreSQL
# seperti dijelaskan pada modul Pertemuan 6.
#
# CATATAN DRIVER: SQLAlchemy 2.1 ke atas mengubah driver default untuk skema
# "postgresql://" menjadi psycopg (v3). Karena modul ini memakai psycopg2-binary,
# driver ditulis eksplisit sebagai "postgresql+psycopg2://" agar konsisten dan
# berjalan di semua versi SQLAlchemy.
# sqlalchemy.url = sqlite:///%(here)s/pyramid_mahasiswa.sqlite
sqlalchemy.url = postgresql+psycopg2://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

# Konfigurasi Alembic: memberi tahu lokasi folder berkas migrasi.
[alembic]
script_location = pyramid_mahasiswa/alembic

# By default, the toolbar only appears for clients from IP addresses
# '127.0.0.1' and '::1'.
# debugtoolbar.hosts = 127.0.0.1 ::1

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = localhost:6543

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine
# "level = INFO" logs SQL queries.
# "level = DEBUG" logs SQL queries and results.
# "level = WARN" logs neither.  (Recommended for production systems.)

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
